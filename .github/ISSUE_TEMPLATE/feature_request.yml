name: Feature request
description: Propose new functionality — a lesson, widget, track, or platform capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Who hits this, and what do they do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Curriculum / notes wiki content
        - Interactive widget
        - Practice app (BuggyShop)
        - Practice app (BuggyAPI)
        - Grading / scoring
        - AI tutor
        - Platform (dashboard, entitlements, talent)
        - Infrastructure / CI / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: invariants
    attributes:
      label: Invariant impact
      description: Does this touch manifest secrecy, score-write ownership, sandbox auth, or any other CLAUDE.md invariant?
    validations:
      required: false
