name: E2E shard (reusable)

# Called by ci.yml once per shard/suite (Task 10). Each call is a fresh
# runner: the live DB the e2e specs hit lives in a local Supabase stack
# reached over `--network host`, so it has to run on the SAME runner as the
# tests — that rules out building once and fanning artifacts out to lighter
# shard runners. Duplicating build+DB-start per call is the cost of sharding
# this suite; the payoff is wall-clock, since the calls run concurrently.

on:
  workflow_call:
    inputs:
      suite:
        description: "Which Playwright suite to run: core, buggyapi, first-paint, or full."
        required: true
        type: string
      shard:
        description: "This shard's 1-based index (core suite only)."
        required: false
        type: number
      shard_total:
        description: "Total shard count (core suite only)."
        required: false
        type: number
      artifact_suffix:
        description: "Unique suffix so concurrent calls never collide on artifact/blob names."
        required: true
        type: string

env:
  SANDBOX_JWT_SECRET: ci-only-secret-not-a-real-one
  NEXT_PUBLIC_PLATFORM_URL: http://localhost:3000
  NEXT_PUBLIC_BUGGYSHOP_URL: http://localhost:3001
  BILLING_ENABLED: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies migrations)
        run: pnpm exec supabase start

      - name: Export Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Lessons live in MDX and reach the DB registry only via `sync --apply`.
      # Without this the lessons table is empty and every learn e2e fails with
      # "Lesson not available".
      - name: Seed curriculum registry
        run: pnpm --filter @qa-mastery/curriculum sync --apply

      - name: Build both apps
        run: pnpm build

      - name: Manifest leak check (client bundles)
        run: |
          if grep -rl "title_internal\|repro_steps_internal" apps/platform/.next/static apps/buggyshop/.next/static apps/buggyapi/.next/static 2>/dev/null; then
            echo "::error::Internal bug-manifest fields found in a client bundle — grading integrity broken."
            exit 1
          fi
          echo "No manifest fields in client bundles."

      - name: Write env for containerized E2E
        run: |
          env | grep -E '^(NEXT_PUBLIC_|SUPABASE_).*=|^(SANDBOX_JWT_SECRET|BILLING_ENABLED)=' > /tmp/e2e.env
          echo "CI=true" >> /tmp/e2e.env
          echo "PLAYWRIGHT_BLOB_OUTPUT_FILE=blob-report/report-${{ inputs.suite }}-${{ inputs.artifact_suffix }}.zip" >> /tmp/e2e.env

      - name: Resolve Playwright args for this suite
        id: args
        run: |
          case "${{ inputs.suite }}" in
            core) CONFIG_ARGS="" ;;
            buggyapi) CONFIG_ARGS="--config=playwright.buggyapi.config.ts" ;;
            first-paint) CONFIG_ARGS="--config=playwright.first-paint.config.ts" ;;
            full) CONFIG_ARGS="--config=playwright.full.config.ts" ;;
            *) echo "::error::Unknown suite '${{ inputs.suite }}'"; exit 1 ;;
          esac
          # Unset `number`-typed workflow_call inputs come through as 0, not
          # empty — a plain `-n` check treats that as "present" and emits a
          # nonsensical `--shard=0/0`, which Playwright rejects outright.
          if [ "${{ inputs.shard || 0 }}" -gt 0 ] && [ "${{ inputs.shard_total || 0 }}" -gt 0 ]; then
            CONFIG_ARGS="$CONFIG_ARGS --shard=${{ inputs.shard }}/${{ inputs.shard_total }}"
          fi
          echo "playwright_args=$CONFIG_ARGS --reporter=blob" >> "$GITHUB_OUTPUT"

      # Same pinned-container reasoning as before sharding: visual.spec.ts
      # baselines and font rendering only hold stable inside this exact image.
      # node_modules is already installed on the runner and the runner
      # (ubuntu-latest) is the same OS/arch (linux-x64 Noble) as this pinned
      # image by design, so only `corepack` is needed inside the container —
      # re-running `pnpm install` there would re-download everything with
      # zero cache.
      - name: "E2E: ${{ inputs.suite }} (${{ inputs.artifact_suffix }}, pinned image)"
        run: |
          docker run --rm --network host \
            --env-file /tmp/e2e.env \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            mcr.microsoft.com/playwright:v1.60.0-noble@sha256:83192064c7510f7ee73dd63dc5f22a5e01a92c81a2e6a9c715d9e3fe55471fd9 \
            bash -c "corepack enable && corepack prepare pnpm@11.6.0 --activate && pnpm --filter @qa-mastery/e2e exec playwright test ${{ steps.args.outputs.playwright_args }}"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ inputs.suite }}-${{ inputs.artifact_suffix }}
          path: e2e/blob-report/
          retention-days: 7
          if-no-files-found: ignore
