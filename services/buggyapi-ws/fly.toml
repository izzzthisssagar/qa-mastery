# Fly.io config for the BuggyAPI WebSocket practice service.
# Free-tier posture: machines auto-stop when idle and auto-start on the next
# connection — the few-second cold start is documented to learners.
#
# First-time setup (once, manual):
#   flyctl launch --no-deploy --copy-config --name qa-mastery-buggyapi-ws
#   flyctl secrets set SANDBOX_JWT_SECRET=… SUPABASE_URL=… SUPABASE_SERVICE_ROLE_KEY=…
# CI then deploys on every main push (deploy.yml, needs FLY_API_TOKEN secret).

app = "qa-mastery-buggyapi-ws"
primary_region = "bom" # ap-south, near the Supabase project

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
