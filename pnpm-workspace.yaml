packages:
  - apps/*
  - packages/*
  - services/*
  - e2e
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  # gray-matter (curriculum frontmatter parsing) is pinned to js-yaml ^3.13.1
  # and calls the v3-only `safeLoad`/`safeDump` API - js-yaml v4 removed both,
  # so this override must stay within the 3.x line. 3.15.0 is the patched
  # release for GHSA-52cp-r559-cp3m (YAML merge-key quadratic CPU DoS).
  js-yaml@<3.15.0: 3.15.0
  # sharp is next's own transitive dep (image optimization) across all 3 apps
  # - 0.34.5 inherits libvips CVEs GHSA-f88m-g3jw-g9cj. 0.35.x is a same-line
  # minor bump, no API next.js depends on changed.
  sharp@<0.35.0: 0.35.3
  # fast-xml-parser is buggyapi's direct dep for the hand-rolled SOAP route
  # (apps/buggyapi/src/app/api/soap/route.ts, XMLParser - unchanged API across
  # this bump). 5.9.3 is vulnerable to GHSA-8r6m-32jq-jx6q (repeated DOCTYPE
  # declarations reset entity-expansion limits); 5.10.1 is patched.
  fast-xml-parser@<5.10.1: 5.10.1
