name: Deploy to Vercel

# Gated on CI: fires only after the "CI" workflow (lint/typecheck/unit/RLS/e2e)
# finishes on main, and only deploys if it passed. Previously this ran on
# every push to main independently of ci.yml — a broken build (or worse, a red
# e2e run) could still go live because nothing blocked it. workflow_run doesn't
# auto-checkout the triggering commit, so the checkout step below pins to
# github.event.workflow_run.head_sha explicitly.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: platform
            project_id: ${{ vars.VERCEL_PLATFORM_PROJECT_ID }}
          - app: buggyshop
            project_id: ${{ vars.VERCEL_BUGGYSHOP_PROJECT_ID }}
          - app: buggyapi
            project_id: ${{ vars.VERCEL_BUGGYAPI_PROJECT_ID }}
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # This job only runs `npx vercel` — pnpm is never installed here.
          # setup-node@v5 defaults package-manager-cache to true, which detects
          # the pnpm lockfile and fails trying to cache without pnpm on PATH.
          package-manager-cache: false

      - name: Deploy ${{ matrix.app }} to Vercel (production)
        # Skip cleanly (job stays green) until the app's Vercel project + repo
        # var exist — lets a new app merge before its infra is provisioned.
        if: matrix.project_id != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ matrix.project_id }}
        run: |
          # Vercel BLOCKS deploys when the git commit author isn't a member of the
          # team (TEAM_ACCESS_REQUIRED). The runner is ephemeral and the target
          # project is selected via VERCEL_ORG_ID / VERCEL_PROJECT_ID, not git, so
          # drop git metadata before deploying.
          rm -rf .git
          npx vercel@57.0.0 deploy --prod --yes --archive=tgz

  # BuggyAPI's WebSocket practice service lives on Fly.io (Vercel serverless
  # can't hold sockets). Skips cleanly until FLY_API_TOKEN is configured and
  # the app has been `flyctl launch`ed once (see services/buggyapi-ws/fly.toml).
  deploy-ws:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-buggyapi-ws
      cancel-in-progress: true
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up flyctl
        if: env.FLY_API_TOKEN != ''
        # Pinned to the ed8efb3 commit (tags v1 / 1.6 both point here as of
        # 2026-07 — @master floated and could change underneath CI with no
        # review).
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy buggyapi-ws to Fly.io
        if: env.FLY_API_TOKEN != ''
        working-directory: services/buggyapi-ws
        run: flyctl deploy --remote-only
