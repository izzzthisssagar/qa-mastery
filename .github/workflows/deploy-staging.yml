name: deploy-staging

# Vercel auto-deploys the two apps from its own Git integration. This workflow
# owns the parts Vercel doesn't: applying DB migrations to the staging
# Supabase project and publishing the curriculum registry.
#
# Task 12: gated on CI's own completion (workflow_run), not a raw push, and
# operates on the exact commit CI verified (`head_sha`) rather than whatever
# HEAD is when the job starts — the same reproducibility guarantee deploy.yml
# has for the Vercel/Fly targets.
#
# Inert until the deploy secrets/vars are configured (the guard step exits
# cleanly), so it never blocks the repo before launch infra exists. To enable:
#   Secrets: SUPABASE_ACCESS_TOKEN, STAGING_SERVICE_ROLE_KEY
#   Vars:    SUPABASE_PROJECT_REF (e.g. rnmxbtokqebkqibsjmrt), STAGING_SUPABASE_URL

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrate-and-seed:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
    steps:
      - name: Guard — skip until deploy secrets are configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Deploy secrets not set — skipping staging deploy (see DEPLOYMENT.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to staging Supabase
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push

      # `db push` exiting 0 only means it didn't error, not that every local
      # migration actually landed — re-run in --dry-run right after and fail
      # if it still lists a pending migration filename.
      - name: Verify no migration is still pending
        if: steps.guard.outputs.skip != 'true'
        run: |
          output=$(pnpm exec supabase db push --dry-run)
          echo "$output"
          if echo "$output" | grep -qE '^\s*[0-9]{14}_'; then
            echo "::error::A migration is still pending after db push — verification failed."
            exit 1
          fi
          echo "All migrations applied — none pending."

      - name: Publish curriculum registry
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --filter @qa-mastery/curriculum sync --apply

      # Smoke: the DB + PostgREST layer this job owns is actually reachable
      # and schema-consistent after migrate+sync, not just that the CLI
      # commands above exited 0.
      - name: Smoke-check the staging REST API
        if: steps.guard.outputs.skip != 'true' && env.NEXT_PUBLIC_SUPABASE_ANON_KEY != ''
        run: |
          status=$(curl -s -o /tmp/smoke.json -w '%{http_code}' \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/lessons?select=id&limit=1" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY")
          cat /tmp/smoke.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Staging REST API smoke check failed: HTTP $status"
            exit 1
          fi
          echo "Staging REST API healthy (200)."
