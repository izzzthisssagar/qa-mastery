name: Bug report
description: Report a real defect in the platform, BuggyShop, or BuggyAPI code itself.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if this is a BuggyShop/BuggyAPI **seeded** bug (`BS-###` /
        `BA-###`) behaving exactly as its manifest describes, it's intentional
        teaching material, not a bug — see the app's bug taxonomy instead.
        Security vulnerabilities go to the private process in `SECURITY.md`, not
        here.
  - type: checkboxes
    id: not-a-seeded-bug
    attributes:
      label: Confirm this isn't a seeded practice-app bug
      options:
        - label: I checked this is not a documented BuggyShop/BuggyAPI seeded bug behaving as intended
          required: true
  - type: input
    id: app
    attributes:
      label: Which app/package
      description: e.g. apps/platform, apps/buggyshop, apps/buggyapi, packages/grading
      placeholder: apps/platform
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, local vs. deployed, and the commit SHA if known.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots
      description: Paste any relevant console output, network response, or screenshot.
    validations:
      required: false
