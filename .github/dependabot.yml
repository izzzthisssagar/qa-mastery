version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      # react and react-dom are pinned to the exact same version in every
      # app (invariant, not a style choice) — vitest/react-dom hard-fail on
      # a mismatch (see PR #113: react bumped alone to 19.2.8 against a
      # react-dom still on 19.2.4 broke @qa-mastery/ui's suite). Group them
      # so dependabot only ever proposes them together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint@8.65.0 (latest published) only supports
      # typescript <6.1.0 per its own peerDependencies — no release
      # supports TS 7 yet. A grouped bump silently pulled typescript to
      # ^7 anyway and broke lint workspace-wide (PR #133, fixed by hand).
      # Block major bumps here until typescript-eslint catches up; drop
      # this once a typescript-eslint release lists TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react@7.37.5 (latest published) peers on eslint
      # ^3..^9.7 only — ESLint 10 broke every JSX package with
      # "contextOrFilename.getFilename is not a function" (same PR #133).
      # Drop this once eslint-plugin-react lists ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
