name: Technical debt / cleanup
description: Flag drift, a missing test, a stale doc, or infrastructure that needs hardening — not a user-facing bug.
labels: ["tech-debt"]
body:
  - type: textarea
    id: what
    attributes:
      label: What's the debt
      description: e.g. a `check-*.mjs` invariant that's local-only and not wired into CI, an undocumented manual step, a flaky test.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: What happens if this stays unfixed
      description: Concretely — what real failure does leaving it alone risk?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: File path(s) or workflow name(s) this touches.
    validations:
      required: false
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix (optional)
    validations:
      required: false
