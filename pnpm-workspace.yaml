packages:
  - apps/*
  - packages/*
  - services/*
  - e2e
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  # gray-matter still requires the js-yaml 3.x safeLoad/safeDump API.
  # 3.15.2 patches GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh.
  "js-yaml@>=3 <3.15.2": 3.15.2
  # Sharp is a Next.js transitive image-optimization dependency in all apps.
  # 0.35.5 patches libheif and librsvg CVEs (GHSA-rgj7-g3m4-5g8c,
  # GHSA-wq5f-xc86-pv6w) without changing its major version.
  "sharp@>=0.35 <0.35.5": 0.35.5
  # Other production transitive patches from the October 2026 security audit.
  # nanoid: GHSA-2v37-7h3g-55p8; source-map-js: GHSA-68fv-2mgg-jv7q.
  "nanoid@>=3 <3.3.18": 3.3.18
  "source-map-js@>=1 <1.2.2": 1.2.2
  # Used under GraphQL Yoga's whatwg-node fetch multipart parser.
  # GHSA-xjh9-v7x6-24jw and GHSA-x8mw-p69m-v3mx.
  "@fastify/busboy@>=3 <3.2.1": 3.2.1
  # fast-xml-parser is buggyapi's direct dep for the hand-rolled SOAP route
  # (apps/buggyapi/src/app/api/soap/route.ts, XMLParser - unchanged API across
  # this bump). 5.9.3 is vulnerable to GHSA-8r6m-32jq-jx6q (repeated DOCTYPE
  # declarations reset entity-expansion limits); 5.10.1 is patched.
  "fast-xml-parser@>=5 <5.10.1": 5.10.1
  # next's transitive postcss was pinned at 8.4.31/8.5.15 (vulnerable) across
  # multiple dependency paths (@vercel/analytics, tailwindcss chain).
  # GHSA-6g55-p6wh-862q (arbitrary file read) needs >=8.5.12;
  # GHSA-r28c-9q8g-f849 (source-map path traversal) needs >=8.5.18. 8.5.21
  # patches both and is a same-line patch bump.
  "postcss@>=8 <8.5.18": 8.5.21
  # Development-only ESLint/Babel toolchain patches, scoped to vulnerable
  # majors and released fixed versions. These do not alter production
  # image, GraphQL, API or authentication behavior.
  "brace-expansion@>=1 <1.1.20": 1.1.20
  "brace-expansion@>=5 <5.0.11": 5.0.11
  "js-yaml@>=4 <4.3.2": 4.3.2
  "browserslist@>=4 <4.28.7": 4.28.7
  # Remaining dev-only 'braces@3.0.3' advisory is NOT suppressed:
  # the registry does not publish the reported patched version 3.0.4 yet.
