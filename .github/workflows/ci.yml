name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no DB / no build — fails in under a couple minutes instead of
  # burning a 20min e2e slot on a lint typo.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: RLS test coverage (every table needs a test)
        run: node scripts/check-rls-coverage.mjs

      - name: E2E CI shape (Task 10)
        run: node scripts/check-e2e-ci-shape.mjs

      - name: Validate curriculum content
        run: pnpm --filter @qa-mastery/curriculum sync

  # Live-DB RLS regression only — split out of `checks` because it's the only
  # static-vs-live-DB step, and out of the e2e shards because it doesn't need
  # a build and shouldn't wait on one.
  rls:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies migrations)
        run: pnpm exec supabase start

      - name: Export Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: RLS regression tests (live DB)
        run: pnpm test:rls

  # Reusable (Task 11): secret scan, production dependency audit, and
  # dependabot.yml validation, aggregated into security.yml's own
  # security-gate job so this needs only one entry, not three.
  security:
    needs: checks
    uses: ./.github/workflows/security.yml

  # Main cross-app suite (everything except buggyapi/first-paint/visual/a11y,
  # see e2e/playwright.config.ts testIgnore), sharded 4 ways so wall-clock
  # stays well under a single long-tail job instead of one runner eating the
  # whole suite sequentially.
  e2e-core:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/e2e-shard.yml
    with:
      suite: core
      shard: ${{ matrix.shard }}
      shard_total: 4
      artifact_suffix: core-${{ matrix.shard }}

  # Own webServer (BuggyAPI) — a third Next server in the main run starved the
  # CI runner and made timing-sensitive platform tests flake.
  e2e-buggyapi:
    needs: checks
    uses: ./.github/workflows/e2e-shard.yml
    with:
      suite: buggyapi
      artifact_suffix: buggyapi

  # Own invocation, workers: 1 — the 6x-CPU-throttle + slow-4G × 20-reload
  # emulation is real CPU load on the runner; running it alongside the main
  # suite starved the shared 2-core runner and flaked unrelated tests.
  e2e-first-paint:
    needs: checks
    uses: ./.github/workflows/e2e-shard.yml
    with:
      suite: first-paint
      artifact_suffix: first-paint

  # Visual regression + a11y: gated to `main` pushes and PRs carrying the
  # `full-e2e` label. These are the slow/flaky-under-load specs (screenshot
  # diffing, axe scans across every page × 2 themes) — not worth every PR's
  # wall-clock, but the full suite still runs before every `main` release.
  e2e-full:
    needs: checks
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-e2e'))
    uses: ./.github/workflows/e2e-shard.yml
    with:
      suite: full
      artifact_suffix: full

  # Downloads every blob-report-* artifact the shards/suites above produced
  # and merges them into the one report humans actually look at. Runs even if
  # a shard failed (a failed shard still uploads its blob report), so the
  # merged report always reflects the full run, not just the passing slice.
  merge-playwright-reports:
    needs: [e2e-core, e2e-buggyapi, e2e-first-paint, e2e-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML + JUnit report
        run: pnpm --filter @qa-mastery/e2e exec playwright merge-reports --config=merge.config.ts ./all-blob-reports

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Provisional gate (Task 10, Task 11 adds `security` to this `needs` set):
  # aggregates every job both tasks added. Task 12 is the first task
  # permitted to wire an actual deployment to it.
  release-gate:
    needs:
      [
        checks,
        rls,
        security,
        e2e-core,
        e2e-buggyapi,
        e2e-first-paint,
        e2e-full,
        merge-playwright-reports,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required jobs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "${{ needs.checks.result }}" = "success" ] || fail "checks did not succeed"
          [ "${{ needs.rls.result }}" = "success" ] || fail "rls did not succeed"
          [ "${{ needs.security.result }}" = "success" ] || fail "security did not succeed"
          [ "${{ needs.e2e-core.result }}" = "success" ] || fail "e2e-core did not succeed"
          [ "${{ needs.e2e-buggyapi.result }}" = "success" ] || fail "e2e-buggyapi did not succeed"
          [ "${{ needs.e2e-first-paint.result }}" = "success" ] || fail "e2e-first-paint did not succeed"
          case "${{ needs.e2e-full.result }}" in
            success|skipped) ;;
            *) fail "e2e-full did not succeed (and was not skipped)" ;;
          esac
          [ "${{ needs.merge-playwright-reports.result }}" = "success" ] || fail "merge-playwright-reports did not succeed"
          echo "All required jobs passed."
