version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      # react and react-dom are pinned to the exact same version in every
      # app (invariant, not a style choice) — vitest/react-dom hard-fail on
      # a mismatch (see PR #113: react bumped alone to 19.2.8 against a
      # react-dom still on 19.2.4 broke @qa-mastery/ui's suite). Group them
      # so dependabot only ever proposes them together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
