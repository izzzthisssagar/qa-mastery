name: security

# workflow_call (Task 11) lets ci.yml run this as part of the same commit's
# checks and read back one aggregate result via security-gate; pull_request/
# push/workflow_dispatch stay too, so this workflow is still independently
# runnable for ad hoc diagnostics (a suspected leaked secret, checking a
# branch before it has a PR) without needing a caller.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits
      # Run the gitleaks binary directly. The gitleaks-action wrapper posts a
      # job-summary via the GitHub API and crashes on that call in this repo;
      # the CLI does the same scan with no API dependency.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb detect \
            --source=/repo --config=/repo/.gitleaks.toml \
            --redact --no-banner --exit-code 1

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Audit runtime deps only: build-time tools (esbuild via vitest/tsx, etc.)
      # aren't shipped to users, and some carry advisories with no published fix.
      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level high

  dependabot-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Catches a malformed dependabot.yml (bad indentation, unknown
      # ecosystem key, typo'd interval) before it silently stops opening
      # update PRs — python3/PyYAML ship on the ubuntu-latest image already,
      # no new dependency needed for a one-off config check.
      - name: Validate dependabot.yml
        run: |
          python3 -c "
          import sys, yaml
          with open('.github/dependabot.yml') as f:
              config = yaml.safe_load(f)
          assert config.get('version') == 2, 'dependabot.yml must be version 2'
          updates = config.get('updates') or []
          assert updates, 'dependabot.yml must declare at least one update block'
          ecosystems = {u.get('package-ecosystem') for u in updates}
          required = {'npm', 'github-actions'}
          missing = required - ecosystems
          assert not missing, f'dependabot.yml missing ecosystems: {missing}'
          for u in updates:
              assert u.get('schedule', {}).get('interval'), f'{u.get(\"package-ecosystem\")} update block missing schedule.interval'
          print('dependabot.yml OK:', ecosystems)
          "

  # Aggregate result a caller (ci.yml's release-gate) can depend on with one
  # `needs:` entry instead of naming all three jobs above individually.
  security-gate:
    needs: [secret-scan, dependency-audit, dependabot-config]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required jobs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "${{ needs.secret-scan.result }}" = "success" ] || fail "secret-scan did not succeed"
          [ "${{ needs.dependency-audit.result }}" = "success" ] || fail "dependency-audit did not succeed"
          [ "${{ needs.dependabot-config.result }}" = "success" ] || fail "dependabot-config did not succeed"
          echo "All required jobs passed."
