name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no DB / no build — fails in under a couple minutes instead of
  # burning a 20min e2e slot on a lint typo.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: RLS test coverage (every table needs a test — P1-7)
        run: node scripts/check-rls-coverage.mjs

      - name: E2E CI shape (shard + gate — P4-3)
        run: node scripts/check-e2e-ci-shape.mjs

      - name: Validate curriculum content
        run: pnpm --filter @qa-mastery/curriculum sync

  # Live-DB RLS regression only — split out of `checks` because it's the only
  # static-vs-live-DB step, and out of the e2e shards because it doesn't need
  # a build and shouldn't wait on one.
  rls-regression:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies migrations)
        run: pnpm exec supabase start

      - name: Export Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: RLS regression tests (live DB)
        run: pnpm test:rls

  # Main cross-app suite (everything except buggyapi/first-paint/visual/a11y,
  # see e2e/playwright.config.ts testIgnore), sharded 4 ways so wall-clock
  # stays under the 20min p95 target (P4-3) instead of one runner eating the
  # whole suite sequentially.
  e2e-core:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/e2e-shard.yml
    with:
      job-label: core-${{ matrix.shard }}
      playwright-args: "--shard=${{ matrix.shard }}/4"

  e2e-buggyapi:
    needs: checks
    uses: ./.github/workflows/e2e-shard.yml
    with:
      job-label: buggyapi
      playwright-args: "--config=playwright.buggyapi.config.ts"

  e2e-first-paint:
    needs: checks
    uses: ./.github/workflows/e2e-shard.yml
    with:
      job-label: first-paint
      playwright-args: "--config=playwright.first-paint.config.ts"

  # Visual regression + a11y: gated to `main` pushes and PRs carrying the
  # `full-e2e` label (P4-3 acceptance — full suite still runs on main +
  # label). These are the slow/flaky-under-load specs (screenshot diffing,
  # axe scans across every page x2 themes) — not worth every PR's wall-clock.
  e2e-full:
    needs: checks
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-e2e'))
    uses: ./.github/workflows/e2e-shard.yml
    with:
      job-label: visual-a11y
      playwright-args: "--config=playwright.full.config.ts"
